<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Love Code</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 30%,#3a0f2b,#12040e 70%);color:#fff;font-family:Georgia,serif;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;text-align:center;padding:20px}
.editor{background:#0d1117;border:1px solid #30363d;border-radius:10px;padding:18px 24px;font:18px/1.8 Consolas,"Courier New",monospace;text-align:left;box-shadow:0 10px 40px rgba(0,0,0,.5);min-width:min(92vw,460px)}
.kw{color:#ff7b72}.fn{color:#d2a8ff}.str{color:#a5d6ff}.out{color:#7ee787}
.cursor{display:inline-block;width:9px;height:1.1em;background:#fff;vertical-align:text-bottom;animation:b 1s steps(1) infinite}
@keyframes b{50%{opacity:0}}
#big{font-size:clamp(2.2rem,9vw,4.5rem);margin:26px 0 8px;opacity:0;transform:scale(.8);transition:all 1.2s;color:#ff8fb7;text-shadow:0 0 25px #ff2d75}
#big.show{opacity:1;transform:scale(1)}
#msg{min-height:4.5em;max-width:560px;font-size:clamp(1.1rem,3.6vw,1.5rem);font-style:italic;color:#ffd6e6;opacity:0;transition:opacity .8s;margin:10px 0}
#msg.show{opacity:1}
button{margin-top:14px;font:inherit;font-size:1.1rem;padding:12px 28px;border:0;border-radius:999px;background:#ff2d75;color:#fff;cursor:pointer;display:none;box-shadow:0 0 20px rgba(255,45,117,.6)}
button:hover{transform:scale(1.05)}button:focus-visible{outline:3px solid #fff;outline-offset:3px}
.rose{position:fixed;bottom:-60px;font-size:30px;pointer-events:none;animation:up linear forwards}
@keyframes up{to{transform:translateY(-115vh) rotate(25deg);opacity:.2}}
@media (prefers-reduced-motion:reduce){.rose{animation-duration:0s!important}}
</style></head>
<body>
<div class="editor"><div><span class="fn">print</span>(<span class="str">"<span id="t"></span></span><span class="cursor" id="cur"></span>)</div>
<div class="out" id="o"></div></div>
<h1 id="big"></h1>
<p id="msg" aria-live="polite"></p>
<button id="btn">Click me ♥</button>
<script>
// ====== EDIT THESE ======
const NAME = "My Love";            // change to her/his name
const CODE_TEXT = "I love you";    // the text typed in the code
const MESSAGES = [
 "Every day with you feels like my favorite chapter.",
 "You are the calm in my chaos and the spark in my ordinary days.",
 "If love were code, you would be the only line I never want to change.",
 "Distance is nothing when my heart already runs on you.",
 "You make me want to be better, softer, braver.",
 "In a world of endless noise, you are my favorite sound.",
 "I'd choose you in every version of every universe.",
 "Thank you for being my home in human form."
];
// ========================
const $=id=>document.getElementById(id);
let i=0,n=0;
function type(){
 if(i<CODE_TEXT.length){$("t").textContent+=CODE_TEXT[i++];setTimeout(type,110)}
 else{$("t").insertAdjacentHTML("afterend",'"');
  setTimeout(()=>{$("o").textContent="> "+CODE_TEXT+", "+NAME+" ♥";$("cur").remove();
   $("big").textContent=CODE_TEXT+" ♥";$("big").classList.add("show");roses(40);
   setTimeout(()=>{$("btn").style.display="inline-block"},1500)},500)}
}
function roses(k){for(let j=0;j<k;j++)setTimeout(()=>{
 const r=document.createElement("div");r.className="rose";r.textContent=["🌹","🌷","💐","❤️","🌸"][Math.floor(Math.random()*5)];
 r.style.left=Math.random()*100+"vw";r.style.animationDuration=(4+Math.random()*4)+"s";r.style.fontSize=(22+Math.random()*26)+"px";
 document.body.appendChild(r);setTimeout(()=>r.remove(),9000)},j*120)}
$("btn").onclick=()=>{
 const m=$("msg");m.classList.remove("show");
 setTimeout(()=>{m.textContent=MESSAGES[n%MESSAGES.length];n++;m.classList.add("show");roses(14)},300)};
setTimeout(type,700);
</script></body></html>
